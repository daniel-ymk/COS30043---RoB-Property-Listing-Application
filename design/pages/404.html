<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · RoB Property</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/rob.css">
</head>
<body data-page="404" data-title="Page not found">
  <div id="nav"></div>
  <main class="container py-5">
    <div class="row align-items-center g-5 py-lg-5">
      <div class="col-lg-6">
        <p class="text-primary fw-bold mb-2">Error 404</p>
        <h1 class="display-5 mb-3">This page has moved out</h1>
        <p class="lead text-muted mb-4">The link may be old, or the listing was removed by its owner.</p>
        <form class="mb-4" role="search" action="listings.html" style="max-width:460px"><label class="form-label" for="q">Search for a home instead</label>
          <div class="input-group"><input class="form-control" id="q" placeholder="Area, city or property name"><button class="btn btn-primary" type="submit"><i class="bi bi-search" aria-hidden="true"></i>Search</button></div></form>
        <div class="d-flex flex-wrap gap-2"><a class="btn btn-outline-secondary" href="home.html"><i class="bi bi-house" aria-hidden="true"></i>Go to home</a><a class="btn btn-outline-secondary" href="map.html"><i class="bi bi-map" aria-hidden="true"></i>Search on the map</a></div>
      </div>
      <div class="col-lg-6"><img src="../img/p04.jpg" alt="" class="w-100 rounded-4" style="aspect-ratio:4/3;object-fit:cover"></div>
    </div>
    <details class="dev-notes">
      <summary>Dev notes · 404 (/:pathMatch(.*)*) · Jason</summary>
      <p class="mb-0 mt-2">Also shown when <code>properties.php?id=</code> returns <code>404</code> inside the detail page (as an empty state, not this route).</p>
    </details>
  </main>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/rob.js"></script>
</body>
</html>
